name: Generate MD and HTML

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check words for proper syllabary
        run: |
          python check-words.py strict

      - name: Generate MD tables and wordlists
        run: |
          cd $GITHUB_WORKSPACE/
          python generate-md.py
          python generate-md.py en
          python generate-wordlist.py

      - name: Generate HTML page
        run: |
          cd $GITHUB_WORKSPACE/
          python generate-html-dictionary.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-html
          path: |
            final/tables-*.md
            final/words-*.txt
            final/html
